name: Native release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
      - run: cargo fmt --check --manifest-path apps/native-host/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path apps/native-host/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path apps/native-host/Cargo.toml
      - run: cargo build --locked --release --manifest-path apps/native-host/Cargo.toml
      - run: pnpm smoke:native
      - name: Skip unsigned tag publication
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Native builds passed, but publication remains disabled until Authenticode and Developer ID notarization are configured in a protected environment."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'workflow_dispatch'
        with:
          name: native-unsigned-${{ runner.os }}
          path: apps/native-host/target/release/open-assistant-native-host*
          retention-days: 7
