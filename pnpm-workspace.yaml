packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
strictPeerDependencies: true
overrides:
  adm-zip: 0.6.0
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "fast-uri@>=3.0.0 <3.1.5": 3.1.5
  "fast-uri@>=4.0.0 <4.1.2": 4.1.2
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "markdownlint-cli2>js-yaml": 5.2.2
  "minimatch@3.1.5>brace-expansion": 5.0.9
  "nanoid@<3.3.18": 3.3.18
  shell-quote: 1.10.0
  "undici@>=7.0.0 <7.29.0": 7.29.0
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@open-assistant/*"
auditConfig:
  # image-size is dev-only through web-ext/addons-linter and has no patched npm release yet.
  # Remove these exceptions when addons-linter consumes a fixed image-size release.
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
