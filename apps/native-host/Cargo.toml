[package]
name = "open-assistant-native-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
futures-util = "=0.3.31"
keyring = "=4.2.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = "=1.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
